plugins {
    id 'com.android.application'
}

android {
    compileSdk 34

    useLibrary 'org.apache.http.legacy'

    // Release signing is only enabled when a keystore is present
    // (CI writes app/release.keystore from the KEYSTORE_BASE64 secret).
    def hasReleaseKeystore = file('release.keystore').exists()
    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile file('release.keystore')
                storePassword System.getenv('RELEASE_STORE_PASSWORD') ?: 'opendeta123'
                keyAlias System.getenv('RELEASE_KEY_ALIAS') ?: 'opendeta'
                keyPassword System.getenv('RELEASE_KEY_PASSWORD') ?: 'opendeta123'
            }
        }
    }

    defaultConfig {
        applicationId "com.opendeta.Mail.Services"
        namespace "com.opendeta.Mail.Services"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 6
        versionName "20.5.2026"
    }

    buildTypes {
        release {
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.md',
                         'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.md',
                         'META-INF/NOTICE.txt', 'META-INF/*.kotlin_module',
                         'META-INF/mailcap', 'META-INF/mailcap.default']
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    // Background scheduler
    implementation 'androidx.work:work-runtime:2.9.1'
    // JavaMail (SMTP send + IMAP inbox fetch)
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'
}
